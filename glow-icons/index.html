<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Glow Icon Creator</title>
  <style>
    :root {
      --bg-1: #090b16;
      --bg-2: #131a2e;
      --panel: rgba(15, 18, 32, 0.88);
      --panel-border: rgba(255,255,255,0.12);
      --text: #edf4ff;
      --muted: #a6b0d2;
      --accent: #7c8dff;
      --icon-size: 140px;
      --glow-strength: 26px;
      --glow-color: #7c8dff;
      --glow-color-2: #5ce1ff;
      --rotation: 0deg;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(126, 96, 255, 0.25), transparent 30%),
        radial-gradient(circle at bottom right, rgba(18, 211, 255, 0.35), transparent 35%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      overflow-x: hidden;
    }

    body { display: grid; place-items: center; min-height: 100vh; padding: 28px; }

    .app {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(320px, 1fr);
      gap: 22px;
      background: rgba(9, 12, 20, 0.52);
      border: 1px solid var(--panel-border);
      border-radius: 28px;
      box-shadow: 0 18px 80px rgba(15, 12, 35, 0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      backdrop-filter: blur(14px);
      padding: 24px;
    }

    .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 22px; padding: 18px 18px 14px; }
    .controls { display: grid; gap: 16px; }
    .label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }

    input[type="text"], select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }

    input[type="text"]:focus, select:focus { border-color: rgba(124,141,255,.8); box-shadow: 0 0 0 4px rgba(124,141,255,.18); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .range-group { display: grid; gap: 8px; }
    .range-inline { display: flex; align-items: center; gap: 10px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .value { min-width: 42px; text-align: right; font-size: 12px; color: var(--muted); }
    .color-row { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
    input[type="color"] { width: 54px; height: 44px; border: 0; border-radius: 10px; background: transparent; padding: 0; }
    .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); cursor: pointer; }
    .swatch:hover { transform: translateY(-1px) scale(1.05); border-color: rgba(255,255,255,.5); }
    .swatch.selected { box-shadow: 0 0 0 2px rgba(255,255,255,.62); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 700;
      letter-spacing: .02em;
      color: #edf5ff;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease;
      background: linear-gradient(135deg, rgba(124,141,255,.98), rgba(92,225,255,.92));
      box-shadow: 0 10px 24px rgba(92,130,255,.35), inset 0 1px 0 rgba(255,255,255,.25);
    }

    button:hover { transform: translateY(-1px); }
    button.secondary { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14); box-shadow: none; }
    .preview-shell { display: grid; grid-template-rows: auto 1fr; gap: 16px; min-height: 540px; }
    .preview-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px 0; }
    .preview-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

    .preview-stage {
      position: relative;
      min-height: 480px;
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.12);
      background: radial-gradient(circle at 50% 20%, rgba(255,255,255,.14), transparent 22%), linear-gradient(135deg, rgba(255,255,255,.02), rgba(255,255,255,.08));
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .preview-stage::before, .preview-stage::after { content: ""; position: absolute; inset: 16% 18%; border-radius: 50%; filter: blur(70px); pointer-events: none; opacity: .8; }
    .preview-stage::before { background: rgba(124,141,255,.28); transform: translate(-18%, -20%); }
    .preview-stage::after { background: rgba(92,225,255,.26); transform: translate(26%, 16%); }

    .neon-card {
      position: relative;
      display: grid;
      place-items: center;
      width: min(78%, 460px);
      aspect-ratio: 1;
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(13,18,31,.52), rgba(10,16,29,.8)), rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 0 28px rgba(255,255,255,.04), 0 14px 38px rgba(2,6,20,.48);
      overflow: hidden;
    }

    .neon-card::before { content: ""; position: absolute; inset: 10%; border-radius: 26px; border: 1px solid rgba(255,255,255,.08); background: linear-gradient(135deg, rgba(124,141,255,.12), rgba(92,225,255,.08), rgba(255,255,255,.02)); transform: scale(1.04); }
    .glow-icon { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; font-size: var(--icon-size); line-height: 1; transform: rotate(var(--rotation)); user-select: none; text-shadow: 0 0 var(--glow-strength) rgba(255,255,255,.92), 0 0 calc(var(--glow-strength) * 1.5) var(--glow-color), 0 0 calc(var(--glow-strength) * 2.1) var(--glow-color-2); transition: font-size .18s ease, transform .18s ease, filter .18s ease; }

    @media (max-width: 860px) { .app { grid-template-columns: 1fr; } .preview-shell { min-height: 440px; } }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel controls">
      <div class="range-group">
        <label class="label" for="emojiText">Icon / Emoji</label>
        <input id="emojiText" type="text" value="⚡" maxlength="4" aria-label="Emoji text" />
      </div>

      <div class="grid-2">
        <div class="range-group"><label class="label" for="sizeRange">Size</label><div class="range-inline"><input id="sizeRange" type="range" min="48" max="220" value="140" /><span class="value" id="sizeValue">140</span></div></div>
        <div class="range-group"><label class="label" for="rotateRange">Rotate</label><div class="range-inline"><input id="rotateRange" type="range" min="-90" max="90" value="0" /><span class="value" id="rotateValue">0°</span></div></div>
      </div>

      <div class="grid-2">
        <div class="range-group"><label class="label" for="glowRange">Glow</label><div class="range-inline"><input id="glowRange" type="range" min="8" max="80" value="26" /><span class="value" id="glowValue">26</span></div></div>
        <div class="range-group"><label class="label" for="blurRange">Blur</label><div class="range-inline"><input id="blurRange" type="range" min="0" max="26" value="12" /><span class="value" id="blurValue">12</span></div></div>
      </div>

      <div class="range-group"><label class="label" for="saturationRange">Saturation</label><div class="range-inline"><input id="saturationRange" type="range" min="40" max="140" value="95" /><span class="value" id="saturationValue">95%</span></div></div>

      <div><label class="label">Glow color</label><div class="color-row"><input id="colorPicker" type="color" value="#7c8dff" /><div class="swatches" id="swatches"></div></div></div>
      <div class="range-group"><label class="label" for="backgroundSelect">Background</label><select id="backgroundSelect"><option value="midnight">Midnight</option><option value="violet">Violet Pulse</option><option value="cyan">Cyan Drift</option><option value="sunset">Sunset Beam</option><option value="deep">Deep Space</option></select></div>
      <div class="actions"><button id="randomBtn" type="button">Random</button><button id="copySvgBtn" type="button" class="secondary">Copy SVG</button><button id="downloadBtn" type="button" class="secondary">Download PNG</button></div>
    </section>

    <section class="panel preview-shell">
      <div class="preview-header"><div class="preview-title">Live neon preview</div></div>
      <div class="preview-stage" id="previewStage"><div class="neon-card"><div class="glow-icon" id="glowIcon" aria-live="polite">⚡</div></div></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const emojiText = $("emojiText"), sizeRange = $("sizeRange"), rotateRange = $("rotateRange"), glowRange = $("glowRange"), blurRange = $("blurRange"), saturationRange = $("saturationRange"), colorPicker = $("colorPicker"), backgroundSelect = $("backgroundSelect"), glowIcon = $("glowIcon"), previewStage = $("previewStage");
    const sizeValue = $("sizeValue"), rotateValue = $("rotateValue"), glowValue = $("glowValue"), blurValue = $("blurValue"), saturationValue = $("saturationValue"), swatchesEl = $("swatches");
    const emojiPool = ["⚡","🔥","✨","💎","🌙","🚀","🎉","💜","⭐","💥","🌈","🦄","🎵","☄️","👾","✅","🌟","💫","🪐","🌌","🛸","🧠","⚙️","❄️","🧩","🎯","💣","🧪","♥️","🥇","🎧","🌊"];
    const palette = ["#7c8dff","#5ce1ff","#ff6ad5","#ffb347","#7ef29a","#ff5f7d","#c27aff","#5df2c3","#ffd166","#8de0ff"];

    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
    function hexToRgb(hex) { const n = parseInt(hex.replace("#", "").padEnd(6, "0"), 16); return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; }
    function rgbToHex(r, g, b) { const h = n => n.toString(16).padStart(2, "0"); return "#" + h(r) + h(g) + h(b); }
    function adjustSaturation(hex, percent) { const {r,g,b} = hexToRgb(hex), k = percent / 100; return rgbToHex(clamp(Math.round(r*k),0,255), clamp(Math.round(g*k),0,255), clamp(Math.round(b*k),0,255)); }

    function setBackground(name) {
      const themes = { midnight:["#090b16","#131a2e"], violet:["#120c22","#1b0f2e"], cyan:["#071520","#0d233a"], sunset:["#1b0c16","#2c2035"], deep:["#050b14","#101923"] };
      const [a,b] = themes[name] || themes.midnight;
      document.documentElement.style.setProperty("--bg-1", a);
      document.documentElement.style.setProperty("--bg-2", b);
    }

    function buildSwatches() {
      swatchesEl.innerHTML = "";
      palette.forEach(hex => { const dot = document.createElement("button"); dot.type="button"; dot.className="swatch"; dot.style.background=hex; dot.setAttribute("aria-label", `Select glow color ${hex}`); if (hex === colorPicker.value.toLowerCase()) dot.classList.add("selected"); dot.onclick=()=>{colorPicker.value=hex; syncControls();}; swatchesEl.appendChild(dot); });
    }

    function syncControls() {
      const size=+sizeRange.value, rotation=+rotateRange.value, glow=+glowRange.value, blur=+blurRange.value, saturation=+saturationRange.value, chosen=colorPicker.value;
      const color=adjustSaturation(chosen,saturation), color2=adjustSaturation(chosen,clamp(saturation+18,40,140));
      document.documentElement.style.setProperty("--icon-size", size+"px"); document.documentElement.style.setProperty("--rotation", rotation+"deg"); document.documentElement.style.setProperty("--glow-strength", glow+"px"); document.documentElement.style.setProperty("--glow-color", color); document.documentElement.style.setProperty("--glow-color-2", color2);
      glowIcon.style.filter=`drop-shadow(0 0 ${glow*.6}px rgba(255,255,255,.8)) drop-shadow(0 0 ${glow*1.1}px ${color}) drop-shadow(0 0 ${glow*1.7}px ${color2}) drop-shadow(0 0 ${glow*2.2}px rgba(255,255,255,.5))`;
      glowIcon.style.textShadow=`0 0 ${glow}px rgba(255,255,255,.92), 0 0 ${glow*1.5}px ${color}, 0 0 ${glow*2.1}px ${color2}`;
      sizeValue.textContent=size; rotateValue.textContent=rotation+"°"; glowValue.textContent=glow; blurValue.textContent=blur; saturationValue.textContent=saturation+"%"; previewStage.style.filter=`blur(${blur*.15}px)`; buildSwatches();
    }

    function updateIconText() { glowIcon.textContent = emojiText.value.trim() || "⚡"; }
    function makeSvgMarkup() { const text=(emojiText.value.trim()||"⚡").slice(0,4), size=+sizeRange.value, glow=+glowRange.value, rotate=+rotateRange.value, color=adjustSaturation(colorPicker.value,+saturationRange.value); return `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="100%" stop-color="#111b2b"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="${clamp(glow/12,1,10)}" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="320" height="320" rx="36" fill="url(#bg)"/><text x="160" y="${160+size*.25}" text-anchor="middle" font-size="${size}" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" fill="${color}" filter="url(#glow)" transform="rotate(${rotate} 160 160)">${text}</text></svg>`; }
    async function copySvg() { const svg=makeSvgMarkup(); try { await navigator.clipboard.writeText(svg); alert("SVG copied to clipboard."); } catch { prompt("Copy this SVG manually:",svg); } }
    function downloadPng() { const canvas=document.createElement("canvas"); canvas.width=canvas.height=1024; const ctx=canvas.getContext("2d"), glow=+glowRange.value, color=adjustSaturation(colorPicker.value,+saturationRange.value), text=(emojiText.value.trim()||"⚡").slice(0,4); const bg=ctx.createRadialGradient(460,300,50,512,512,900); bg.addColorStop(0,"rgba(255,255,255,.1)"); bg.addColorStop(.35,"#0e1221"); bg.addColorStop(1,"#060a12"); ctx.fillStyle=bg; ctx.fillRect(0,0,1024,1024); ctx.save(); ctx.translate(512,512); ctx.rotate((+rotateRange.value*Math.PI)/180); ctx.font=`${+sizeRange.value*4}px Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif`; ctx.textAlign="center"; ctx.textBaseline="middle"; for(let i=0;i<18;i++){ctx.save();ctx.shadowBlur=glow*(1.2+i*.05);ctx.shadowColor=color;ctx.fillStyle=i%2?color:"#fff";ctx.fillText(text,0,0);ctx.restore();} ctx.restore(); const a=document.createElement("a"); a.download="neon-glow-icon.png"; a.href=canvas.toDataURL("image/png"); a.click(); }

    $("randomBtn").onclick=()=>{ emojiText.value=emojiPool[Math.floor(Math.random()*emojiPool.length)]; updateIconText(); syncControls(); };
    emojiText.oninput=updateIconText;
    [sizeRange,rotateRange,glowRange,blurRange,saturationRange,colorPicker].forEach(el=>el.addEventListener("input",syncControls));
    backgroundSelect.onchange=()=>setBackground(backgroundSelect.value);
    $("copySvgBtn").onclick=copySvg; $("downloadBtn").onclick=downloadPng;
    setBackground(backgroundSelect.value); updateIconText(); syncControls();
  </script>
</body>
</html>
